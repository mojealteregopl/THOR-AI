[package]
name = "thor-nativecore"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "THOR secure native Zenoh client and JNI interface (independent of Android UI)"

[lib]
name = "thor_nativecore"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
jni = "=0.22.4"
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time"] }
zenoh = { version = "=1.10.1", default-features = false, features = ["transport_tls", "transport_tcp"] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true
